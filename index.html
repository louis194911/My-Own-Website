<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis | Personal Space</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0ea5e9;
            --accent-soft: rgba(14, 165, 233, 0.08);
            --border-color: #e2e8f0;
            --shadow-subtle: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
            --shadow-hover: 0 20px 40px -10px rgba(15, 23, 42, 0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* 优雅流体布局容器 */
        .page-container {
            width: 100%;
            max-width: 960px;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 2.5rem;
            align-items: start;
        }

        /* 通用卡片容器 */
        .glass-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            padding: 2.2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* 左侧个人与状态区 */
        .profile-column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .profile-header {
            text-align: center;
            padding: 0.5rem 0;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.2rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--surface-color);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.04);
        }

        h1 {
            margin: 0 0 0.4rem 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .location-tag {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 500;
        }

        /* 实时状态模块 */
        .status-module {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: center;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: var(--radius-md);
            padding: 1.4rem;
            border: 1px solid #e2e8f0;
        }

        .date-text {
            font-size: 0.82rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .time-text {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .weather-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 优雅的链接按钮 */
        .external-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.9rem 1.2rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.02);
            transition: all 0.2s ease;
        }

        .external-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .external-link:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: var(--accent-soft);
            transform: translateY(-2px);
        }

        /* 右侧留言板区 */
        .guestbook-column {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .section-title {
            margin: 0 0 0.2rem 0;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .section-desc {
            margin: 0 0 1rem 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .honeypot-field {
            display: none !important;
            visibility: hidden !important;
        }

        .input-box {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        textarea.input-box {
            resize: vertical;
            min-height: 85px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 0.2rem;
        }

        .status-msg {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .status-msg.error { color: #e11d48; }
        .status-msg.success { color: #16a34a; }

        .submit-btn {
            padding: 0.75rem 1.4rem;
            background-color: var(--text-main);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 留言列表 */
        .messages-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 0.3rem;
            margin-top: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.2rem;
        }

        .messages-container::-webkit-scrollbar {
            width: 5px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        .message-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem 1.1rem;
            transition: border-color 0.2s;
        }

        .message-card.pinned {
            background-color: var(--accent-soft);
            border-color: rgba(14, 165, 233, 0.3);
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }

        .message-author {
            font-weight: 600;
            color: var(--text-main);
        }

        .message-time {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .message-text {
            margin: 0;
            font-size: 0.92rem;
            color: #334155;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .footer {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* 移动端自适应 */
        @media (max-width: 768px) {
            .page-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            body {
                padding: 1rem 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 左侧栏：个人资料 + 实时状态 + 链接 -->
        <div class="profile-column">
            <div class="glass-card profile-header">
                <div class="avatar-container">
                    <img src="IMG_4999.JPG" class="avatar" alt="Louis">
                </div>
                <h1>Louis</h1>
                <div class="location-tag">📍 Lahti, Finland</div>
            </div>

            <div class="glass-card status-module">
                <div class="date-text" id="finland-date">Syncing date...</div>
                <div class="time-text" id="finland-time">00:00:00</div>
                <div class="weather-text" id="finland-weather">Fetching weather...</div>
            </div>

            <a href="https://github.com/louis194911" target="_blank" rel="noopener noreferrer" class="external-link glass-card" style="padding: 1rem 1.2rem;">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
                <span>GitHub Profile</span>
            </a>
        </div>

        <!-- 右侧栏：云端留言板 -->
        <div class="glass-card guestbook-column">
            <div>
                <h2 class="section-title">Guestbook 💬</h2>
                <p class="section-desc">Leave a comment, say hi, or share your thoughts!</p>
            </div>

            <form class="guestbook-form" id="guestbook-form">
                <input type="text" id="bot-trap" class="honeypot-field" tabindex="-1" autocomplete="off">
                <input type="text" id="guest-name" class="input-box" placeholder="Your Name (optional)" maxlength="30">
                <textarea id="guest-message" class="input-box" placeholder="Write your message here..." required maxlength="250"></textarea>
                
                <div class="form-footer">
                    <span id="form-status" class="status-msg"></span>
                    <button type="submit" id="submit-btn" class="submit-btn">Post Message</button>
                </div>
            </form>

            <div class="messages-container" id="messages-list"></div>
        </div>

        <div class="footer">
            &copy; 2026 Louis. All rights reserved.
        </div>
    </div>

    <script>
        // ==========================================
        // 核心配置：Supabase 数据库连接
        // ==========================================
        const SUPABASE_URL = 'https://rtbqbzwglptrhxovxhsu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0YnFiendnbHB0cmh4b3Z4aHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Mzk1NzksImV4cCI6MjEwODAxNTU3OX0.pezdCfM4yhS4wtEb6hX40P_YIwjdyuCaV2UWDcbw00k';

        function getSupabaseHeaders(isPost = false) {
            const headers = { 'apikey': SUPABASE_KEY.trim() };
            if (SUPABASE_KEY.trim().startsWith('eyJ')) {
                headers['Authorization'] = `Bearer ${SUPABASE_KEY.trim()}`;
            }
            if (isPost) {
                headers['Content-Type'] = 'application/json';
                headers['Prefer'] = 'return=minimal';
            }
            return headers;
        }

        // 1. 芬兰时间与日期更新
        function updateTime() {
            const timeElement = document.getElementById('finland-time');
            const dateElement = document.getElementById('finland-date');
            const now = new Date();
            
            dateElement.textContent = now.toLocaleDateString('en-US', { 
                timeZone: 'Europe/Helsinki', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            timeElement.textContent = now.toLocaleTimeString('en-US', { 
                timeZone: 'Europe/Helsinki', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // 2. Open-Meteo 天气获取
        async function fetchWeather() {
            const weatherElement = document.getElementById('finland-weather');
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=60.9827&longitude=25.6615&current_weather=true';
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    const weatherCodes = {
                        0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
                        45: "Fog", 48: "Rime fog", 51: "Light drizzle", 53: "Moderate drizzle",
                        55: "Dense drizzle", 61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
                        71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 77: "Snow grains",
                        80: "Rain showers", 81: "Moderate showers", 82: "Violent showers",
                        85: "Snow showers", 86: "Heavy snow showers", 95: "Thunderstorm"
                    };
                    const condition = weatherCodes[code] || "Cloudy";
                    const tempStr = temp > 0 ? `+${temp}°C` : `${temp}°C`;
                    weatherElement.textContent = `${condition} · ${tempStr}`;
                } else {
                    weatherElement.textContent = "Weather unavailable";
                }
            } catch (error) {
                weatherElement.textContent = "Weather network error";
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 1800000);

        // 3. 云端留言板逻辑
        const form = document.getElementById('guestbook-form');
        const botTrap = document.getElementById('bot-trap');
        const nameInput = document.getElementById('guest-name');
        const messageInput = document.getElementById('guest-message');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('form-status');
        const messagesList = document.getElementById('messages-list');

        const pinnedMessage = {
            name: "Louis",
            message: "Welcome to my personal space! Feel free to leave a message below.",
            time: "Pinned",
            isPinned: true
        };

        function setStatus(text, type = '') {
            statusMsg.textContent = text;
            statusMsg.className = `status-msg ${type}`;
        }

        function createCardElement(msg) {
            const card = document.createElement('div');
            card.className = msg.isPinned ? 'message-card pinned' : 'message-card';

            const meta = document.createElement('div');
            meta.className = 'message-meta';

            const author = document.createElement('span');
            author.className = 'message-author';
            author.textContent = msg.name || 'Anonymous';

            const time = document.createElement('span');
            time.className = 'message-time';
            time.textContent = msg.time;

            const text = document.createElement('p');
            text.className = 'message-text';
            text.textContent = msg.message;

            meta.appendChild(author);
            meta.appendChild(time);
            card.appendChild(meta);
            card.appendChild(text);
            return card;
        }

        async function loadMessages() {
            messagesList.innerHTML = '';
            messagesList.appendChild(createCardElement(pinnedMessage));

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?select=*&order=created_at.desc&limit=50`, {
                    headers: getSupabaseHeaders(false)
                });

                if (res.ok) {
                    const data = await res.json();
                    data.forEach(row => {
                        const dateStr = new Date(row.created_at).toLocaleDateString('en-US', {
                            month: 'short', day: 'numeric', year: 'numeric'
                        });
                        messagesList.appendChild(createCardElement({
                            name: row.name,
                            message: row.message,
                            time: dateStr
                        }));
                    });
                }
            } catch (err) {
                console.error('Failed to fetch messages:', err);
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (botTrap.value) {
                form.reset();
                setStatus('Message posted!', 'success');
                return;
            }

            const lastPostTime = localStorage.getItem('last_post_timestamp');
            const now = Date.now();
            if (lastPostTime && now - parseInt(lastPostTime) < 60000) {
                const waitSec = Math.ceil((60000 - (now - parseInt(lastPostTime))) / 1000);
                setStatus(`Please wait ${waitSec}s.`, 'error');
                return;
            }

            const text = messageInput.value.trim();
            const name = nameInput.value.trim() || 'Anonymous';
            if (!text) return;

            const linkRegex = /(https?:\/\/|www\.|[a-zA-Z0-9-]+\.(com|cn|net|org|io|xyz|top|me|info))/i;
            if (linkRegex.test(text) || linkRegex.test(name)) {
                setStatus('Links not allowed.', 'error');
                return;
            }

            submitBtn.disabled = true;
            setStatus('Posting...', '');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook`, {
                    method: 'POST',
                    headers: getSupabaseHeaders(true),
                    body: JSON.stringify({ name: name, message: text })
                });

                if (res.ok) {
                    localStorage.setItem('last_post_timestamp', Date.now().toString());
                    messageInput.value = '';
                    setStatus('Posted successfully!', 'success');
                    await loadMessages();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    const detail = errData.message || errData.error || `HTTP ${res.status}`;
                    setStatus(`Error: ${detail}`, 'error');
                }
            } catch (err) {
                setStatus('Network error.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadMessages();
    </script>
</body>
</html>
