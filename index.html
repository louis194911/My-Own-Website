<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bofeng Li | Personal Space</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #334155;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: block;
            border: 4px solid var(--card-bg);
            box-shadow: 0 0 0 4px var(--accent-color);
            object-fit: cover;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: 500;
        }
        
        /* 时间与天气展示区样式 */
        .widget-panel {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            border: 1px solid #475569;
        }

        .time-display {
            font-size: 1.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .weather-display {
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: transparent;
            color: var(--text-color);
            text-decoration: none;
            border: 1px solid #475569;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 保持你的头像 -->
        <img src="IMG_4999.JPG" class="avatar" alt="Bofeng Li">
        
        <h1>Louis</h1>
        
        <p class="subtitle">
            <span class="highlight">Software and Systems Engineering</span>
        </p>

        <!-- 实时时间与天气面板 -->
        <div class="widget-panel">
            <div class="time-display" id="finland-time">00:00:00</div>
            <div class="weather-display" id="finland-weather">
                <span>正在获取拉赫蒂天气...</span>
            </div>
        </div>

        <div class="links-container">
            <!-- 仅保留 GitHub 入口 -->
            <a href="https://github.com/louis194911" target="_blank" class="link-btn">GitHub Profile 💻</a>
        </div>

        <div class="footer">
            &copy; 2026 Louis. All rights reserved.
        </div>
    </div>

    <script>
        // 1. 实时更新芬兰时间 (Europe/Helsinki 时区)
        function updateTime() {
            const timeElement = document.getElementById('finland-time');
            const now = new Date();
            
            // 使用 Intl API 将本地时间转换为芬兰时区时间格式
            const options = { 
                timeZone: 'Europe/Helsinki',
                hour12: false,
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            };
            
            timeElement.textContent = now.toLocaleTimeString('zh-CN', options);
        }

        // 初始化并每秒更新时间
        updateTime();
        setInterval(updateTime, 1000);

        // 2. 获取芬兰拉赫蒂 (Lahti) 的天气
        async function fetchWeather() {
            const weatherElement = document.getElementById('finland-weather');
            try {
                // 使用 wttr.in 免费接口 (format=1 缩略模式，只返回天气图标和温度)
                const response = await fetch('https://wttr.in/Lahti?format=1');
                if (response.ok) {
                    const data = await response.text();
                    weatherElement.innerHTML = `<span>📍 Lahti, Finland</span> <span>|</span> <span>${data}</span>`;
                } else {
                    weatherElement.innerHTML = `<span>📍 Lahti, Finland</span> <span>|</span> <span>天气数据暂不可用</span>`;
                }
            } catch (error) {
                weatherElement.innerHTML = `<span>📍 Lahti, Finland</span> <span>|</span> <span>网络请求失败</span>`;
            }
        }

        // 页面加载时获取一次天气
        fetchWeather();
        // 设置每半小时 (1800000 毫秒) 刷新一次天气，避免频繁请求被 API 封禁
        setInterval(fetchWeather, 1800000);
    </script>
</body>
</html>
