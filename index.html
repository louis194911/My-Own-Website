<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis — Personal Space</title>
    <!-- 引入圆润现代字体 Plus Jakarta Sans 与艺术衬线体 Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f4efe6;
            --bg-island: #fbf9f5;
            --bg-pill: #ebe4d8;
            --ink-main: #1c1917;
            --ink-muted: #78716c;
            --ink-soft: #a8a29e;
            --accent: #df5a49;
            --accent-soft: rgba(223, 90, 73, 0.12);
            --accent-secondary: #2e6f40;
            --border-organic: rgba(28, 25, 23, 0.08);
            --font-serif: "Instrument Serif", Georgia, serif;
            --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        [data-mood="sage"] {
            --bg-canvas: #eaf0eb;
            --bg-island: #f6f9f6;
            --bg-pill: #dce6de;
            --accent: #2e6f40;
            --accent-soft: rgba(46, 111, 64, 0.12);
        }

        [data-mood="peach"] {
            --bg-canvas: #f7ece8;
            --bg-island: #fdf8f6;
            --bg-pill: #eedcd5;
            --accent: #d94e34;
            --accent-soft: rgba(217, 78, 52, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-canvas);
            color: var(--ink-main);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* 全屏铺满视口布局 (100vw x 100vh) */
        .viewport-canvas {
            width: 100vw;
            min-height: 100vh;
            padding: clamp(1.2rem, 2.8vw, 2.8rem) clamp(1.5rem, 4vw, 4.5rem);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.5rem;
            position: relative;
        }

        /* 顶部流体导航栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-island);
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            border: 1px solid var(--border-organic);
            box-shadow: 0 4px 20px rgba(28, 25, 23, 0.03);
        }

        /* wodniack 风格灵动双眼交互组件 */
        .eyes-widget {
            display: inline-flex;
            gap: 3px;
            align-items: center;
        }

        .eye {
            width: 18px;
            height: 22px;
            background: var(--ink-main);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pupil {
            width: 7px;
            height: 7px;
            background: var(--bg-island);
            border-radius: 50%;
            transition: transform 0.05s linear;
        }

        .brand-text {
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.2px;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--bg-island);
            padding: 0.4rem 0.55rem;
            border-radius: 999px;
            border: 1px solid var(--border-organic);
        }

        .mood-btn {
            border: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ink-muted);
            padding: 0.38rem 0.85rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .mood-btn:hover {
            color: var(--ink-main);
        }

        .mood-btn.active {
            background: var(--ink-main);
            color: var(--bg-island);
        }

        /* 核心全屏双栏有机舞台 */
        .stage-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.08fr 1fr;
            gap: clamp(2rem, 4vw, 4.5rem);
            align-items: stretch;
            min-height: 0;
        }

        /* 左侧：有机视觉与生活状态区 */
        .left-stage {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.5rem;
        }

        /* 主视觉名片：流体形态头像 + 艺术大标题 */
        .hero-island {
            background: var(--bg-island);
            border-radius: 44px;
            padding: clamp(2rem, 3.2vw, 3.2rem);
            border: 1px solid var(--border-organic);
            box-shadow: 0 18px 45px -15px rgba(28, 25, 23, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.8rem;
            flex: 1;
        }

        /* 背景柔和暖光晕装饰 */
        .hero-island::before {
            content: '';
            position: absolute;
            right: -60px;
            top: -60px;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 2.5vw, 2.5rem);
            flex-wrap: wrap;
        }

        /* 有机水滴动态变形头像 (彻底告别方块) */
        .blob-avatar-wrap {
            position: relative;
            width: 136px;
            height: 136px;
            flex-shrink: 0;
        }

        .blob-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 62% 38% 46% 54% / 60% 63% 37% 40%;
            animation: morphBlob 10s ease-in-out infinite alternate;
            box-shadow: 0 14px 30px rgba(28, 25, 23, 0.12);
            border: 3px solid var(--bg-canvas);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .blob-avatar:hover {
            transform: scale(1.06) rotate(-3deg);
        }

        @keyframes morphBlob {
            0% { border-radius: 62% 38% 46% 54% / 60% 63% 37% 40%; }
            50% { border-radius: 45% 55% 62% 38% / 53% 42% 58% 47%; }
            100% { border-radius: 58% 42% 38% 62% / 44% 59% 41% 56%; }
        }

        .hero-greeting {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .serif-tag {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.45rem;
            color: var(--accent);
            line-height: 1;
        }

        .hero-title {
            margin: 0;
            font-family: var(--font-serif);
            font-weight: 400;
            font-size: clamp(3.4rem, 5.5vw, 5.2rem);
            line-height: 0.95;
            letter-spacing: -1px;
            color: var(--ink-main);
        }

        .hero-title em {
            font-style: italic;
            color: var(--accent);
        }

        /* 趣味弹性胶囊标签群 (Interactive Bouncy Pills) */
        .sticker-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            align-items: center;
        }

        .organic-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-pill);
            color: var(--ink-main);
            padding: 0.65rem 1.2rem;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, color 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .organic-pill:hover {
            transform: translateY(-4px) rotate(-1.5deg) scale(1.03);
        }

        .organic-pill.github-pill {
            background: var(--ink-main);
            color: var(--bg-island);
            padding: 0.7rem 1.4rem;
        }

        .organic-pill.github-pill:hover {
            background: var(--accent);
            color: #ffffff;
            transform: translateY(-4px) rotate(1.5deg) scale(1.04);
        }

        .organic-pill svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* 芬兰拉赫蒂流体时间与气象岛 */
        .sky-island {
            background: var(--bg-island);
            border-radius: 40px;
            padding: 1.8rem 2.4rem;
            border: 1px solid var(--border-organic);
            box-shadow: 0 18px 45px -15px rgba(28, 25, 23, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .sky-left {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            z-index: 2;
        }

        .sky-date {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--ink-muted);
            letter-spacing: 0.2px;
        }

        .sky-time {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 4.5vw, 4.2rem);
            line-height: 1;
            color: var(--ink-main);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
        }

        .sky-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.45rem;
            z-index: 2;
        }

        .weather-badge {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 0.5rem 1.1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .weather-sub {
            font-size: 0.82rem;
            color: var(--ink-muted);
            font-weight: 500;
        }

        /* 底部流体声波曲线装饰 SVG */
        .wave-deco {
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 46px;
            opacity: 0.35;
            pointer-events: none;
        }

        /* 右侧：有机便签式留言墙 (Guestbook Island) */
        .guestbook-island {
            background: var(--bg-island);
            border-radius: 44px;
            padding: clamp(1.8rem, 3vw, 2.8rem);
            border: 1px solid var(--border-organic);
            box-shadow: 0 18px 45px -15px rgba(28, 25, 23, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.4rem;
            height: 100%;
        }

        .gb-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .gb-title {
            margin: 0;
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 400;
            line-height: 1;
        }

        .gb-title span {
            font-style: italic;
            color: var(--accent);
        }

        .gb-subtitle {
            margin: 0;
            font-size: 0.86rem;
            color: var(--ink-muted);
        }

        /* 柔和胶囊表单 */
        .gb-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .honeypot-field {
            display: none !important;
            visibility: hidden !important;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .organic-input {
            width: 100%;
            background: var(--bg-canvas);
            border: 1.5px solid transparent;
            border-radius: 22px;
            padding: 0.9rem 1.25rem;
            font-family: var(--font-sans);
            font-size: 0.92rem;
            color: var(--ink-main);
            transition: all 0.25s ease;
        }

        .organic-input::placeholder {
            color: var(--ink-soft);
        }

        .organic-input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 8px 24px var(--accent-soft);
        }

        textarea.organic-input {
            resize: none;
            height: 84px;
            border-radius: 24px;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0 0.2rem;
        }

        .status-pill {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-muted);
        }

        .status-pill.error { color: #dc2626; }
        .status-pill.success { color: #16a34a; }

        .send-pill-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 0.78rem 1.65rem;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, opacity 0.2s;
            box-shadow: 0 8px 20px -4px rgba(223, 90, 73, 0.45);
        }

        .send-pill-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 24px -4px rgba(223, 90, 73, 0.55);
        }

        .send-pill-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 留言便签流 (Tactile Note Stream) */
        .notes-stream {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-height: 310px;
            overflow-y: auto;
            padding: 0.3rem 0.4rem 0.3rem 0.1rem;
        }

        .notes-stream::-webkit-scrollbar {
            width: 5px;
        }
        .notes-stream::-webkit-scrollbar-thumb {
            background: var(--bg-pill);
            border-radius: 999px;
        }

        .note-bubble {
            background: var(--bg-canvas);
            border-radius: 26px;
            padding: 1.05rem 1.35rem;
            border: 1px solid var(--border-organic);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 赋予每张留言卡片细微的有机错落感，拒绝呆板对齐 */
        .note-bubble:nth-child(odd) {
            border-bottom-left-radius: 8px;
        }
        .note-bubble:nth-child(even) {
            border-bottom-right-radius: 8px;
        }

        .note-bubble:hover {
            transform: translateY(-2px) rotate(-0.4deg);
        }

        .note-bubble.pinned {
            background: var(--accent-soft);
            border-color: rgba(223, 90, 73, 0.22);
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
            font-size: 0.8rem;
        }

        .note-author {
            font-weight: 700;
            color: var(--ink-main);
        }

        .note-bubble.pinned .note-author {
            color: var(--accent);
        }

        .note-date {
            color: var(--ink-muted);
            font-size: 0.75rem;
        }

        .note-content {
            margin: 0;
            font-size: 0.93rem;
            line-height: 1.5;
            color: var(--ink-main);
            word-wrap: break-word;
        }

        /* 底部温和签名栏 */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--ink-muted);
            padding: 0 0.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .bottom-bar em {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.05rem;
            color: var(--ink-main);
        }

        /* 响应式适配：平板与手机自然流式展开 */
        @media (max-width: 960px) {
            .stage-grid {
                grid-template-columns: 1fr;
            }
            .viewport-canvas {
                padding: 1.2rem;
            }
            .hero-island, .sky-island, .guestbook-island {
                border-radius: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="viewport-canvas">
        <!-- 顶部灵动导航栏 -->
        <header class="top-bar">
            <div class="brand-pill">
                <div class="eyes-widget" aria-hidden="true">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                </div>
                <span class="brand-text">bofengli.com</span>
            </div>

            <div class="top-controls" role="group" aria-label="Color Mood Switcher">
                <button type="button" class="mood-btn active" data-mood="paper">Warm Paper</button>
                <button type="button" class="mood-btn" data-mood="sage">Sage Mist</button>
                <button type="button" class="mood-btn" data-mood="peach">Peach Glow</button>
            </div>
        </header>

        <!-- 中央全屏有机双栏舞台 -->
        <main class="stage-grid">
            <!-- 左侧：有机头像名片 + 芬兰实时天气时钟岛 -->
            <div class="left-stage">
                <section class="hero-island">
                    <div class="hero-top">
                        <div class="blob-avatar-wrap">
                            <img src="IMG_4999.JPG" class="blob-avatar" alt="Louis">
                        </div>
                        <div class="hero-greeting">
                            <span class="serif-tag">Hello, I’m</span>
                            <h1 class="hero-title">Louis<em>.</em></h1>
                        </div>
                    </div>

                    <div class="sticker-cloud">
                        <span class="organic-pill">📍 Lahti, Finland</span>
                        <span class="organic-pill" id="daylight-pill">✨ Nordic Timezone</span>
                        <a href="https://github.com/louis194911" target="_blank" rel="noopener noreferrer" class="organic-pill github-pill">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                            </svg>
                            <span>GitHub @louis194911 ↗</span>
                        </a>
                    </div>
                </section>

                <!-- 芬兰拉赫蒂实时时间与气象岛 -->
                <section class="sky-island">
                    <div class="sky-left">
                        <div class="sky-date" id="finland-date">Syncing date...</div>
                        <div class="sky-time" id="finland-time">00:00:00</div>
                    </div>

                    <div class="sky-right">
                        <div class="weather-badge" id="w-badge">Loading sky...</div>
                        <div class="weather-sub" id="w-wind">60.98°N, 25.66°E</div>
                    </div>

                    <!-- 柔和有机波浪线条装饰 -->
                    <svg class="wave-deco" viewBox="0 0 1440 120" preserveAspectRatio="none">
                        <path fill="var(--accent)" fill-opacity="0.18" d="M0,64L80,58.7C160,53,320,43,480,48C640,53,800,75,960,80C1120,85,1280,75,1360,69.3L1440,64L1440,120L1360,120C1280,120,1120,120,960,120C800,120,640,120,480,120C320,120,160,120,80,120L0,120Z"></path>
                    </svg>
                </section>
            </div>

            <!-- 右侧：温暖便签式云端留言墙 -->
            <section class="guestbook-island">
                <div>
                    <div class="gb-header">
                        <h2 class="gb-title">Guestbook <span>&amp; Notes</span></h2>
                        <p class="gb-subtitle">Say hi or leave a warm note below</p>
                    </div>

                    <form class="gb-form" id="guestbook-form" style="margin-top: 1.2rem;">
                        <input type="text" id="bot-trap" class="honeypot-field" tabindex="-1" autocomplete="off">
                        <div class="form-row">
                            <input type="text" id="guest-name" class="organic-input" placeholder="Your name (optional)" maxlength="30">
                            <textarea id="guest-message" class="organic-input" placeholder="Write a message... (No links allowed)" required maxlength="250"></textarea>
                        </div>
                        <div class="form-actions">
                            <span id="form-status" class="status-pill">Ready to post</span>
                            <button type="submit" id="submit-btn" class="send-pill-btn">Send Note ✦</button>
                        </div>
                    </form>
                </div>

                <div class="notes-stream" id="messages-list"></div>
            </section>
        </main>

        <!-- 底部有机页脚 -->
        <footer class="bottom-bar">
            <span>Crafted with warmth in <em>Lahti, Finland</em></span>
            <span>&copy; 2026 Louis. All rights reserved.</span>
        </footer>
    </div>

    <script>
        // ==========================================
        // 0. 核心配置：Supabase 云端密钥
        // ==========================================
        const SUPABASE_URL = 'https://rtbqbzwglptrhxovxhsu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0YnFiendnbHB0cmh4b3Z4aHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0Mzk1NzksImV4cCI6MjEwODAxNTU3OX0.pezdCfM4yhS4wtEb6hX40P_YIwjdyuCaV2UWDcbw00k';

        function getSupabaseHeaders(isPost = false) {
            const headers = { 'apikey': SUPABASE_KEY.trim() };
            if (SUPABASE_KEY.trim().startsWith('eyJ')) {
                headers['Authorization'] = `Bearer ${SUPABASE_KEY.trim()}`;
            }
            if (isPost) {
                headers['Content-Type'] = 'application/json';
                headers['Prefer'] = 'return=minimal';
            }
            return headers;
        }

        // ==========================================
        // 1. 顶部浅色氛围主题切换 (Warm Paper / Sage / Peach)
        // ==========================================
        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const mood = btn.dataset.mood;
                if (mood === 'paper') {
                    document.documentElement.removeAttribute('data-mood');
                } else {
                    document.documentElement.setAttribute('data-mood', mood);
                }
            });
        });

        // ==========================================
        // 2. wodniack 风格灵动眼睛跟随交互 (零卡顿轻量级计算)
        // ==========================================
        const pupils = document.querySelectorAll('.pupil');
        window.addEventListener('pointermove', (e) => {
            pupils.forEach(pupil => {
                const rect = pupil.parentElement.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
                const distance = Math.min(4.5, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 25);
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                pupil.style.transform = `translate(${x}px, ${y}px)`;
            });
        });

        // ==========================================
        // 3. 芬兰时间与昼夜氛围感知
        // ==========================================
        function updateTime() {
            const timeElement = document.getElementById('finland-time');
            const dateElement = document.getElementById('finland-date');
            const daylightPill = document.getElementById('daylight-pill');
            const now = new Date();
            
            dateElement.textContent = now.toLocaleDateString('en-US', { 
                timeZone: 'Europe/Helsinki', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            const timeStr = now.toLocaleTimeString('en-US', { 
                timeZone: 'Europe/Helsinki', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            timeElement.textContent = timeStr;

            const hour = parseInt(timeStr.split(':')[0], 10);
            if (hour >= 6 && hour < 12) {
                daylightPill.textContent = '☕ Crisp Nordic Morning';
            } else if (hour >= 12 && hour < 18) {
                daylightPill.textContent = '☀️ Bright Afternoon';
            } else if (hour >= 18 && hour < 22) {
                daylightPill.textContent = '🌇 Cozy Evening';
            } else {
                daylightPill.textContent = '🌙 Quiet Night Owl';
            }
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ==========================================
        // 4. Open-Meteo 实时天气获取
        // ==========================================
        async function fetchWeather() {
            const badgeEl = document.getElementById('w-badge');
            const windEl = document.getElementById('w-wind');
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=60.9827&longitude=25.6615&current_weather=true';
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    const temp = Math.round(data.current_weather.temperature);
                    const wind = Math.round(data.current_weather.windspeed);
                    const code = data.current_weather.weathercode;
                    const weatherCodes = {
                        0: "☀️ Clear sky", 1: "🌤️ Mainly clear", 2: "⛅ Partly cloudy", 3: "☁️ Overcast",
                        45: "🌫️ Foggy", 48: "🌫️ Rime fog", 51: "🌦️ Light drizzle", 53: "🌦️ Drizzle",
                        55: "🌧️ Dense drizzle", 61: "🌧️ Slight rain", 63: "🌧️ Rain", 65: "🌧️ Heavy rain",
                        71: "🌨️ Slight snow", 73: "❄️ Snow", 75: "❄️ Heavy snow", 77: "❄️ Snow grains",
                        80: "🌦️ Rain showers", 81: "🌧️ Showers", 82: "⛈️ Heavy showers",
                        85: "🌨️ Snow showers", 86: "❄️ Heavy snow", 95: "⚡ Thunderstorm"
                    };
                    const condition = weatherCodes[code] || "☁️ Cloudy";
                    const tempStr = temp > 0 ? `+${temp}°C` : `${temp}°C`;
                    badgeEl.textContent = `${condition} · ${tempStr}`;
                    windEl.textContent = `Gentle breeze ${wind} km/h in Lahti`;
                } else {
                    badgeEl.textContent = "Weather offline";
                }
            } catch (error) {
                badgeEl.textContent = "Weather unavailable";
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 1800000);

        // ==========================================
        // 5. 云端留言板逻辑
        // ==========================================
        const form = document.getElementById('guestbook-form');
        const botTrap = document.getElementById('bot-trap');
        const nameInput = document.getElementById('guest-name');
        const messageInput = document.getElementById('guest-message');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('form-status');
        const messagesList = document.getElementById('messages-list');

        const pinnedMessage = {
            name: "Louis",
            message: "Welcome to my personal space! Feel free to leave a message below.",
            time: "📌 Pinned Note",
            isPinned: true
        };

        function setStatus(text, type = '') {
            statusMsg.textContent = text;
            statusMsg.className = `status-pill ${type}`;
        }

        function createNoteElement(msg) {
            const bubble = document.createElement('div');
            bubble.className = msg.isPinned ? 'note-bubble pinned' : 'note-bubble';

            const meta = document.createElement('div');
            meta.className = 'note-meta';

            const author = document.createElement('span');
            author.className = 'note-author';
            author.textContent = msg.name || 'Anonymous';

            const date = document.createElement('span');
            date.className = 'note-date';
            date.textContent = msg.time;

            const content = document.createElement('p');
            content.className = 'note-content';
            content.textContent = msg.message;

            meta.appendChild(author);
            meta.appendChild(date);
            bubble.appendChild(meta);
            bubble.appendChild(content);
            return bubble;
        }

        async function loadMessages() {
            messagesList.innerHTML = '';
            messagesList.appendChild(createNoteElement(pinnedMessage));

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?select=*&order=created_at.desc&limit=50`, {
                    headers: getSupabaseHeaders(false)
                });

                if (res.ok) {
                    const data = await res.json();
                    data.forEach(row => {
                        const dateStr = new Date(row.created_at).toLocaleDateString('en-US', {
                            month: 'short', day: 'numeric', year: 'numeric'
                        });
                        messagesList.appendChild(createNoteElement({
                            name: row.name,
                            message: row.message,
                            time: dateStr
                        }));
                    });
                }
            } catch (err) {
                console.error('Failed to fetch messages:', err);
            }
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (botTrap.value) {
                form.reset();
                setStatus('Note posted!', 'success');
                return;
            }

            const lastPostTime = localStorage.getItem('last_post_timestamp');
            const now = Date.now();
            if (lastPostTime && now - parseInt(lastPostTime) < 60000) {
                const waitSec = Math.ceil((60000 - (now - parseInt(lastPostTime))) / 1000);
                setStatus(`Please wait ${waitSec}s before posting again`, 'error');
                return;
            }

            const text = messageInput.value.trim();
            const name = nameInput.value.trim() || 'Anonymous';
            if (!text) return;

            const linkRegex = /(https?:\/\/|www\.|[a-zA-Z0-9-]+\.(com|cn|net|org|io|xyz|top|me|info))/i;
            if (linkRegex.test(text) || linkRegex.test(name)) {
                setStatus('Links are not allowed in notes', 'error');
                return;
            }

            submitBtn.disabled = true;
            setStatus('Sending note...', '');

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/guestbook`, {
                    method: 'POST',
                    headers: getSupabaseHeaders(true),
                    body: JSON.stringify({ name: name, message: text })
                });

                if (res.ok) {
                    localStorage.setItem('last_post_timestamp', Date.now().toString());
                    messageInput.value = '';
                    setStatus('Note added to the wall!', 'success');
                    await loadMessages();
                } else {
                    const errData = await res.json().catch(() => ({}));
                    const detail = errData.message || errData.error || `HTTP ${res.status}`;
                    setStatus(`Error: ${detail}`, 'error');
                }
            } catch (err) {
                setStatus('Network error, please try again', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadMessages();
    </script>
</body>
